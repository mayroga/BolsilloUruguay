<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BolsilloUruguay</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
    <main class="container">
        <h1>BolsilloUruguay</h1>
        <p class="subtitle">Asesor de Ahorro y Soluciones</p>
        
        <!-- Botón de aceptación manual de ubicación local y del dispositivo -->
        <div id="permisoBox" class="permiso-box">
            <p>Para mostrarte opciones cercanas exactas, presiona aceptar.</p>
            <button onclick="activarGPS()">Aceptar</button>
        </div>

        <div class="search-box" id="searchBox" style="display:none;">
            <input type="text" id="userInput" placeholder="Ej: ¿Dónde comprar más barato o hacer un trámite?" autocomplete="off">
            
            <!-- Botón de Micrófono: Mantener presionado para hablar, soltar para enviar -->
            <button id="micBtn" class="mic-btn" onmousedown="iniciarEscucha()" onmouseup="detenerEscucha()" onttouchstart="iniciarEscucha()" ontouchend="detenerEscucha()">
                🎙️ Mantén presionado para hablar
            </button>

            <button onclick="enviarConsulta()">Consultar</button>
        </div>

        <div id="resultado" class="result-box" style="display: none;">
            <p id="textoRespuesta"></p>
            <button id="whatsappBtn" class="wa-btn" onclick="compartirWhatsApp()">Compartir por WhatsApp</button>
        </div>
    </main>

    <script>
        let userLat = null;
        let userLon = null;
        let recognition = null;

        function activarGPS() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        userLat = position.coords.latitude;
                        userLon = position.coords.longitude;
                        document.getElementById("permisoBox").style.display = "none";
                        document.getElementById("searchBox").style.display = "flex";
                        inicializarVoz();
                    },
                    (error) => {
                        document.getElementById("permisoBox").style.display = "none";
                        document.getElementById("searchBox").style.display = "flex";
                        inicializarVoz();
                    }
                );
            } else {
                document.getElementById("permisoBox").style.display = "none";
                document.getElementById("searchBox").style.display = "flex";
                inicializarVoz();
            }
        }

        function inicializarVoz() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (SpeechRecognition) {
                recognition = new SpeechRecognition();
                recognition.lang = 'es-UY';
                recognition.interimResults = false;
                recognition.maxAlternatives = 1;

                recognition.onresult = (event) => {
                    const speechToText = event.results[0][0].transcript;
                    document.getElementById("userInput").value = speechToText;
                    enviarConsulta();
                };

                recognition.onerror = (event) => {
                    document.getElementById("micBtn").innerText = "🎙️ Mantén presionado para hablar";
                };
            } else {
                document.getElementById("micBtn").style.display = "none";
            }
        }

        function iniciarEscucha() {
            if (recognition) {
                try {
                    document.getElementById("micBtn").innerText = "🔴 Escuchando... (suelta al terminar)";
                    recognition.start();
                } catch(e) {}
            }
        }

        function detenerEscucha() {
            if (recognition) {
                try {
                    recognition.stop();
                    document.getElementById("micBtn").innerText = "🎙️ Mantén presionado para hablar";
                } catch(e) {}
            }
        }

        async function enviarConsulta() {
            const mensaje = document.getElementById("userInput").value;
            if (!mensaje.trim()) return;

            const response = await fetch("/consultar", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ mensaje, lat: userLat, lon: userLon })
            });

            const data = await response.json();
            document.getElementById("textoRespuesta").innerText = data.respuesta;
            document.getElementById("resultado").style.display = "block";
        }

        function compartirWhatsApp() {
            const texto = document.getElementById("textoRespuesta").innerText;
            const url = `https://api.whatsapp.com/send?text=${encodeURIComponent("Mirá este dato útil: " + texto)}`;
            window.open(url, "_blank");
        }
    </script>
</body>
</html>
